apiVersion: v1
kind: Service
metadata:
  labels:
    app: tiktok-signature
  name: tiktok-signature
  namespace: sg-tiktok-prod
spec:
  ports:
  - port: 8080
    name: api
    protocol: TCP
    targetPort: 8080
  selector:
    app: tiktok-signature
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-signature
  namespace: sg-tiktok-prod
  labels:
    app: tiktok
    type: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiktok-signature
  template:
    metadata:
      labels:
        app: tiktok-signature
    spec:
      containers:
      - name: tiktok-signature
        image: harbor.sgdctroy.net/sg-tiktok-prod/tiktok-signature:COMMIT_SHA
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 100
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: Unconfined
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: 8080tcp
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          initialDelaySeconds: 300
          periodSeconds: 900
          failureThreshold: 2
          timeoutSeconds: 10
          httpGet:
            path: /health
            port: 8080
        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 300
          failureThreshold: 2
          timeoutSeconds: 15
          httpGet:
            path: /health
            port: 8080
      restartPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tiktok-signature-ingress
  namespace: sg-tiktok-prod
spec:
  rules:
    - host: tiktok-sig.k8s-prod.sgdctroy.net
      http:
        paths:
          - backend:
              service:
                name: tiktok-signature
                port:
                  number: 8080
            path: /
            pathType: Prefix
